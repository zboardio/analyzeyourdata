# Docker Swarm Stack - Local Build (Manual Deploy)
#
# Deploy:
#   cd /opt/analyzeyourdata
#   git pull origin main
#   docker build -t analyzeyourdata:latest --build-arg GIT_COMMIT=$(git rev-parse --short HEAD) .
#   docker stack deploy -c docker-compose.local.yml ayd
#
# The env_file directive loads variables directly - no shell export needed.

networks:
  default:
    driver: overlay
    ipam:
      config:
        - subnet: 10.10.0.0/24

x-standard-deploy: &standard-deploy
  # Baseline. `docker stack deploy` always resets Replicas to this value, so a
  # surged service drops back here on every deploy and the autoscaler raises it
  # again within a couple of ticks.
  replicas: 1
  labels:
    ayd.autoscale: "true"
    ayd.autoscale.min: "1"
    ayd.autoscale.max: "3"
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: rollback
    order: start-first
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
  resources:
    limits:
      cpus: '1.0'
      memory: 2G
    reservations:
      cpus: '0.1'
      memory: 384M

x-high-traffic-deploy: &high-traffic-deploy
  # Single-node Swarm: one replica per language is the baseline; en/es keep the
  # higher CPU/memory ceiling below. Horizontal surge up to ayd.autoscale.max is
  # applied at runtime by the autoscaler service - see ops/autoscaler/README.md.
  replicas: 1
  labels:
    ayd.autoscale: "true"
    ayd.autoscale.min: "1"
    ayd.autoscale.max: "3"
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: rollback
    order: start-first
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
  resources:
    limits:
      cpus: '1.5'
      memory: 2G
    reservations:
      cpus: '0.25'
      memory: 512M

x-common-settings: &common-settings
  image: analyzeyourdata:latest
  env_file: .env
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/')"]
    interval: 30s
    timeout: 30s
    retries: 5
    start_period: 60s

services:
  app-en:
    <<: *common-settings
    ports:
      - "8050:8050"
    environment:
      - APP_LANGUAGE=en
    deploy:
      <<: *high-traffic-deploy

  app-es:
    <<: *common-settings
    ports:
      - "8055:8050"
    environment:
      - APP_LANGUAGE=es
    deploy:
      <<: *high-traffic-deploy

  app-cs:
    <<: *common-settings
    ports:
      - "8051:8050"
    environment:
      - APP_LANGUAGE=cs
    deploy:
      <<: *standard-deploy

  app-da:
    <<: *common-settings
    ports:
      - "8054:8050"
    environment:
      - APP_LANGUAGE=da
    deploy:
      <<: *standard-deploy

  app-de:
    <<: *common-settings
    ports:
      - "8052:8050"
    environment:
      - APP_LANGUAGE=de
    deploy:
      <<: *standard-deploy

  app-fr:
    <<: *common-settings
    ports:
      - "8056:8050"
    environment:
      - APP_LANGUAGE=fr
    deploy:
      <<: *standard-deploy

  app-hr:
    <<: *common-settings
    ports:
      - "8057:8050"
    environment:
      - APP_LANGUAGE=hr
    deploy:
      <<: *standard-deploy

  app-it:
    <<: *common-settings
    ports:
      - "8058:8050"
    environment:
      - APP_LANGUAGE=it
    deploy:
      <<: *standard-deploy

  app-nl:
    <<: *common-settings
    ports:
      - "8059:8050"
    environment:
      - APP_LANGUAGE=nl
    deploy:
      <<: *standard-deploy

  app-pl:
    <<: *common-settings
    ports:
      - "8053:8050"
    environment:
      - APP_LANGUAGE=pl
    deploy:
      <<: *standard-deploy

  app-pt:
    <<: *common-settings
    ports:
      - "8060:8050"
    environment:
      - APP_LANGUAGE=pt
    deploy:
      <<: *standard-deploy

  app-sk:
    <<: *common-settings
    ports:
      - "8061:8050"
    environment:
      - APP_LANGUAGE=sk
    deploy:
      <<: *standard-deploy

  app-sl:
    <<: *common-settings
    ports:
      - "8062:8050"
    environment:
      - APP_LANGUAGE=sl
    deploy:
      <<: *standard-deploy

  app-sv:
    <<: *common-settings
    ports:
      - "8063:8050"
    environment:
      - APP_LANGUAGE=sv
    deploy:
      <<: *standard-deploy

  app-uk:
    <<: *common-settings
    ports:
      - "8064:8050"
    environment:
      - APP_LANGUAGE=uk
    deploy:
      <<: *standard-deploy

  # Swarm autoscaler. Not part of the application - separate image built from
  # ops/autoscaler/, never bundled into ghcr.io/zboardio/analyzeyourdata.
  # Holds the Docker socket, so it must sit on a manager node.
  autoscaler:
    image: ayd-swarm-autoscaler:latest
    # Tuning belongs to the host, not the repo: the replica ceiling depends on
    # the node's cores, and the dry-run switch is an operational toggle that
    # must not need a commit and a CI build to flip. Copy
    # .env.example.autoscaler to .env.autoscaler on the host and edit there.
    # Every value has a default in ops/autoscaler/autoscaler.py, so the file
    # only needs the lines you actually want to change -- but it must exist,
    # exactly like .env does for the application services.
    env_file: .env.autoscaler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
